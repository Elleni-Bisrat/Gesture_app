name: silent_talk
description: Silent Talk - sign language communication
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.6
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  flutter_tts: ^3.8.5
  speech_to_text: ^7.3.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/hand_landmark_full.tflite
    - assets/images/splashI.png
    - assets/images/homeSignL.png
    - assets/images/voice.png
    - assets/images/holdPen.jpg
